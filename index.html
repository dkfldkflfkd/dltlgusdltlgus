<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-image: url(grape.png);
            background-repeat: no-repeat;
            background-position: right top;
            margin-right: 200px;
            background-attachment: fixed;
        }
    </style>
</head>
<body>
까마득한 날에<br>
하늘이 처음 열리고<br>
어데 닭 우는 소리 들렷스랴<br><br>

모든 山脉들이<br>
바다를 戀慕해 휘달릴때도<br>
참아 이곧을 犯하든 못하였으리라<br><br>

끈임없는 光陰을<br>
부지런한 季節이 픠여선 지고<br>
큰 江물이 비로소 길을 열엇다<br><br>

지금 눈 나리고<br>
梅花香氣 홀로 아득하니<br>
내 여기 가난한 노래의 씨를 뿌려라<br><br>

다시 千古의 뒤에<br>
白馬타고 오는 超人이 있어<br>
이 曠野에서 목노아 부르게하리라<br><br>
    
</body>
</html>
